# Explicit full profile; migrate, verify old indexes and preflight before starting.
x-full-features: &full-features
  MODEL_CENTER_ENABLED: "true"
  SHARING_ENABLED: "true"
  DOCUMENT_VERSIONS_ENABLED: "true"
  DOCUMENT_PUBLICATION_ENABLED: "true"
  WORKSPACES_ENABLED: "true"
  CHAT_RUNS_ENABLED: "true"
  HIERARCHY_ENABLED: "true"
  KNOWLEDGE_QUALITY_ENABLED: "true"
  EVALUATION_ENABLED: "true"
  CAPABILITY_CENTER_ENABLED: "true"

services:
  backend:
    environment:
      <<: *full-features
  ingestion-worker:
    environment:
      <<: *full-features
  run-worker:
    extends:
      file: compose.yaml
      service: ingestion-worker
    environment:
      <<: *full-features
      WORKER_HEARTBEAT_FILE: /tmp/rag-run-worker-id
    command: ["python", "-m", "app.run_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.run_worker", "--healthcheck"]
  evaluation-worker:
    extends:
      file: compose.yaml
      service: ingestion-worker
    environment:
      <<: *full-features
      WORKER_HEARTBEAT_FILE: /tmp/rag-evaluation-worker-id
    command: ["python", "-m", "app.evaluation_worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.evaluation_worker", "--healthcheck"]
